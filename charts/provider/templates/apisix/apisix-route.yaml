{{- if not .Values.ingressGrpc.enabled }}
{{- range $chain := .Values.chains }}
{{- $domainName := printf "%s.%s" (default $chain.name $chain.subdomain | lower) (include "provider.domain" $) }}

---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: {{ include "provider.fullname" $ }}-{{ $chain.name | lower }}
  namespace: {{ include "provider.namespace" $ }}
  labels:
    {{- include "provider.labels" $ | nindent 4 }}
spec:
  http:
    - match:
        hosts:
          - {{ $domainName }}
        paths:
          - /*
      name: grpc
      upstreams:
        - name: {{ include "provider.fullname" $ }}-{{ $chain.name | lower }}
---
{{- end }}
{{- end }}
