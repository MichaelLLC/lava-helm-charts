{{- if .Values.serviceAccount.create }}
{{- range $chain := .Values.chains }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "provider.serviceAccountName" $ }}-{{ $chain.name | lower }}
  labels:
    {{- include "provider.labels" $ | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
