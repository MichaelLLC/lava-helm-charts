{{- range $chain := $.Values.chains }}
{{- if and $chain.persistence $chain.persistence.enabled }}
{{- $podIndexConfigEnabled := false }}
{{- with $chain.podIndexConfig }}
{{- $podIndexConfigEnabled = .enabled }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "provider.fullname" $ }}-{{ $chain.name | lower }}
  labels:
    {{- include "provider.labels" $ | nindent 4 }}
    app.lavanet.io/chain: {{ $chain.name | lower }}
spec:
  replicas: {{ default $.Values.replicaCount $chain.replicaCount }}
  serviceName: {{ include "provider.serviceAccountName" $ }}-{{ $chain.name | lower }}
  minReadySeconds: {{ $.Values.statefulSetUpdate.minReadySeconds }}
  updateStrategy:
    type: {{ $.Values.statefulSetUpdate.updateStrategy }}
  podManagementPolicy: "Parallel"
  selector:
    matchLabels:
      {{- include "provider.selectorLabels" $ | nindent 6 }}
      app.lavanet.io/chain: {{ $chain.name | lower }}
  template:
    metadata:
      annotations:
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if not $chain.existingConfigSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- end }}
      labels:
        {{- include "provider.selectorLabels" $ | nindent 8 }}
        app.lavanet.io/chain: {{ $chain.name | lower }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      serviceAccountName: {{ include "provider.serviceAccountName" $ }}-{{ $chain.name | lower }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}

      initContainers:
        - name: import-keys
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              if [ -f /lava/.key-{{ $.Values.wallet }}.imported ]; then
                echo "Key {{ $.Values.wallet }} has already been exported, exiting..."
                exit 0
              fi
              echo $KEY_PASSWORD | lavap keys import {{ $.Values.wallet }} /tmp/keyfile/{{ $.Values.key.secretKey }} --keyring-backend {{ $.Values.keyringBackend }}
              touch /lava/.key-{{ $.Values.wallet }}.imported
          env:
            - name: KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.key.passwordSecretName }}
                  key: {{ $.Values.key.passwordSecretKey }}
          {{- if $.Values.initContainers.resources }}
          resources:
            {{- toYaml $.Values.initContainers.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: private-key-volume
              mountPath: /tmp/keyfile/{{ $.Values.key.secretKey }}
              subPath: {{ $.Values.key.secretKey }}
              readOnly: true
            - mountPath: /lava
              name: data
      {{- if $podIndexConfigEnabled }}
        - name: render-provider-config
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              grep -q '__POD_INDEX__' /config-template/config.yml
              sed "s/__POD_INDEX__/${MY_POD_INDEX}/g" /config-template/config.yml > /runtime-config/config.yml
              if grep -q '__POD_INDEX__' /runtime-config/config.yml; then
                echo "Failed to render provider config for pod index ${MY_POD_INDEX}" >&2
                exit 1
              fi
          env:
            - name: MY_POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
          volumeMounts:
            - mountPath: /config-template
              name: {{ $chain.name | lower }}-config-template
              readOnly: true
            - mountPath: /runtime-config
              name: {{ $chain.name | lower }}-runtime-config
      {{- end }}

      containers:
        - name: {{ $.Chart.Name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          {{- if $.Values.preStop.enabled }}
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep {{ $.Values.preStop.sleepSeconds }}"
          {{- end }}
          args:
            - "rpcprovider"
            {{- if $chain.existingConfigSecret }}
            - {{ $chain.existingConfigSecretKey }}
            {{- else }}
            - config.yml
            {{- end }}
            - --node
            - {{ $.Values.node }}
            - --from
            - {{ $.Values.wallet }}
            - --keyring-backend
            - {{ $.Values.keyringBackend }}
            - --chain-id
            - {{ $.Values.chainId }}
            - --geolocation
            - {{ $.Values.geolocation | quote }}
            - --shard-id
            - "$(MY_POD_INDEX)"
            {{- if $.Values.cache.enabled }}
            - --cache-be
            - {{ $.Values.cache.address }}
            {{- end }}
            - --log_level
            - {{- with $chain.log }}
              {{ .level | default $.Values.log.level }}
              {{- else }}
              {{ $.Values.log.level }}
              {{- end }}
            - --log_format
            - {{ $.Values.log.format }}
            {{- range $val := $.Values.additionalArgs }}
            - {{ $val | quote }}
            {{- end }}
          env:
            - name: MY_POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            {{- if not $.Values.otel.tracing.enabled }}
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ $.Values.service.port }}
              protocol: TCP
            {{- if $.Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ $.Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- if $.Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ $.Values.startupProbe.path }}
              port: {{ $.Values.startupProbe.port }}
              scheme: {{ $.Values.startupProbe.scheme }}
            initialDelaySeconds: {{ $.Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.startupProbe.timeoutSeconds }}
            successThreshold: {{ $.Values.startupProbe.successThreshold }}
            failureThreshold: {{ $.Values.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $.Values.livenessProbe.path }}
              port: {{ $.Values.livenessProbe.port }}
              scheme: {{ $.Values.livenessProbe.scheme }}
            initialDelaySeconds: {{ $.Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ $.Values.livenessProbe.successThreshold }}
            failureThreshold: {{ $.Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $.Values.readinessProbe.path }}
              port: {{ $.Values.readinessProbe.port }}
              scheme: {{ $.Values.readinessProbe.scheme }}
            initialDelaySeconds: {{ $.Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.readinessProbe.timeoutSeconds }}
            successThreshold: {{ $.Values.readinessProbe.successThreshold }}
            failureThreshold: {{ $.Values.readinessProbe.failureThreshold }}
          volumeMounts:
            - mountPath: /lava
              name: data
            {{- if $podIndexConfigEnabled }}
            - mountPath: /lava/config
              name: {{ $chain.name | lower }}-runtime-config
              readOnly: true
            {{- else }}
            - mountPath: /lava/config/config.yml
              subPath: config.yml
              name: {{ $chain.name | lower }}-config
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml (default $.Values.resources $chain.resources) | nindent 12 }}

      volumes:
        {{- if $podIndexConfigEnabled }}
        - name: {{ $chain.name | lower }}-config-template
          secret:
            secretName: {{ default (print (include "provider.fullname" $) "-" ($chain.name | lower)) $chain.existingConfigSecret }}
        - name: {{ $chain.name | lower }}-runtime-config
          emptyDir: {}
        {{- else }}
        - name: {{ $chain.name | lower }}-config
          secret:
            secretName: {{ default (print (include "provider.fullname" $) "-" ($chain.name | lower)) $chain.existingConfigSecret }}
        {{- end }}
        - name: private-key-volume
          secret:
            secretName: {{ $.Values.key.secretName }}
            optional: false
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "provider.fullname" $ }}-{{ $chain.name | lower }}

      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if $.Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          {{- if $.Values.podAntiAffinity.required }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "provider.selectorLabels" $ | nindent 18 }}
                  app.lavanet.io/chain: {{ $chain.name | lower }}
              topologyKey: {{ $.Values.podAntiAffinity.topologyKey | quote }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ $.Values.podAntiAffinity.weight }}
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "provider.selectorLabels" $ | nindent 20 }}
                    app.lavanet.io/chain: {{ $chain.name | lower }}
                topologyKey: {{ $.Values.podAntiAffinity.topologyKey | quote }}
          {{- end }}
      {{- else }}
        {{- with $.Values.affinity }}
      affinity:
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end }}
{{- end }}
